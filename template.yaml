AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Compress new objects in an S3 bucket to ZIP with a container-image Lambda

Parameters:
  ReleaseId:
    Type: String
    AllowedPattern: ".+"
    Description: >-
      Identifier of the release being deployed; `make deploy` passes the git
      commit. Used as AutoPublishCodeSha256, so each release publishes a new
      Lambda version. No default on purpose: deploying without it would leave
      the version unchanged.
  LogRetentionDays:
    Type: Number
    Default: 14
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.0.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.16.0/20

Resources:
  # --- network -------------------------------------------------------------
  # Private subnets only: no internet gateway, no NAT. The function's only
  # dependency is S3, which it reaches through a gateway endpoint. A NAT
  # gateway would bill per GB for every byte the function reads and writes.

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private"

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable
      # Nothing in this VPC should talk to any bucket other than ours.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/*"

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archiver function, outbound HTTPS only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # The route table only has the S3 endpoint, so 0.0.0.0/0 here doesn't
        # open a path to the internet.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # --- storage -------------------------------------------------------------

  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Fixed name so the function policy can point at it without !Ref.
      # Referencing the bucket from both the policy and the notification
      # gives CloudFormation a circular dependency.
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning is intentionally off. With versioning on, deleting the
      # original only adds a delete marker and the bytes stay billed.

  # Events that still fail after Lambda's async retries end up here instead
  # of being dropped.
  FailedEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # --- compute -------------------------------------------------------------

  ArchiverFunction:
    Type: AWS::Serverless::Function
    # don't let S3 events reach the function before it has a route to S3
    DependsOn: S3GatewayEndpoint
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 120
      # Every deploy publishes an immutable version and moves the "live" alias
      # to it. S3 invokes the alias, so rolling back is just pointing the alias
      # at an older version.
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      # SAM decides whether to publish by hashing the template before
      # parameters are resolved, so a new ReleaseId in the environment alone
      # left the version unchanged (seen on the second deploy). Using it as
      # the code hash makes each release publish a new version.
      AutoPublishCodeSha256: !Ref ReleaseId
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        SecurityGroupIds:
          - !Ref FunctionSecurityGroup
      Environment:
        Variables:
          LOG_LEVEL: INFO
          RELEASE_ID: !Ref ReleaseId
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedEventsQueue.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/*"
            # without ListBucket a missing key comes back as 403 instead of 404,
            # and the handler can't tell "already archived" from a real error
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      Events:
        # Every new object triggers the function, as the task asks. The zips it
        # writes back trigger it too; the handler returns immediately for those,
        # and Lambda's recursive loop detection for S3 is a platform backstop.
        # This costs one short invocation per zip, which the README prices.
        NewObject:
          Type: S3
          Properties:
            Bucket: !Ref ArchiveBucket
            Events: s3:ObjectCreated:*
    Metadata:
      DockerContext: ./archiver
      Dockerfile: Dockerfile
      DockerTag: python3.12

  # Lambda would create this group itself on first run, but with no retention,
  # and at millions of invocations a day log storage adds up.
  ArchiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ArchiverFunction}"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  BucketName:
    Value: !Ref ArchiveBucket
  FunctionName:
    Value: !Ref ArchiverFunction
  LiveAlias:
    Value: !Ref ArchiverFunctionAliaslive
  FailedEventsQueueUrl:
    Value: !Ref FailedEventsQueue
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
